name: Security & Regression CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-tests:
    name: OWASP / STRIDE Security & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check all server and client scripts
        run: |
          for f in server.mjs api/*.mjs js/*.js; do
            node --check "$f"
          done

      - name: Run automated security, OctoMask, and case-study tests
        run: npm test

